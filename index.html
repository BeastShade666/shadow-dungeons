<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#161126"><title>Shadow Dungeons</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0b18;color:white;font-family:system-ui,sans-serif;overflow:hidden}canvas{display:block}#hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-weight:700;text-shadow:0 2px 5px #000}#panel{position:fixed;inset:0;background:#0d0b18ee;display:grid;place-items:center;z-index:5;padding:20px;overflow:auto}.card{width:min(460px,100%);background:#231b38;border:1px solid #66518a;border-radius:18px;padding:24px;text-align:center;box-shadow:0 10px 40px #0008}h1{color:#c5a4ff}button,select{background:#6745a7;color:white;border:1px solid #a889e1;border-radius:12px;padding:12px 16px;font:inherit;margin:5px;cursor:pointer}button:active{transform:scale(.96)}#controls{position:fixed;bottom:22px;left:16px;right:16px;display:none;justify-content:space-between;align-items:end;pointer-events:none}#controls button{pointer-events:auto;touch-action:none;min-width:62px;min-height:62px;font-weight:900}#joystick{width:144px;height:144px;border-radius:50%;border:3px solid #a889e1;background:#35264caa;position:relative;pointer-events:auto;touch-action:none;user-select:none;box-shadow:inset 0 0 20px #0006}#stick{width:64px;height:64px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#c6a7ff,#7651b2);border:2px solid #e0caff;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 3px 12px #0009}#attack{background:#aa315f}small{color:#c6bdd8}#error{position:fixed;bottom:4px;color:#ffb8b8;left:10px;font-size:12px}
</style></head><body>
<div id="hud"><span id="stats"></span><span id="stage"></span></div><div id="panel"><div class="card"><h1>⚔ Shadow Dungeons</h1><p id="message">Enter the dungeon. Defeat enemies, collect gold, and return stronger.</p><p id="wallet"></p><label>Hero color <select id="heroColor"><option value="purple">Violet</option><option value="green">Emerald</option><option value="blue">Azure</option></select></label><div id="shop"></div><button id="start">Enter Dungeon</button><p><small>Move: WASD / arrow keys • Attack: Space or button • Mobile: drag the joystick to move</small></p></div></div>
<div id="controls"><div id="joystick" aria-label="Movement joystick"><div id="stick"></div></div><button id="attack">ATTACK</button></div><div id="error"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id);
const saved=()=>{try{return JSON.parse(localStorage.getItem('shadow-save')||'{}')}catch{return {}}};
let data={gold:0,aura:false,...saved()},level=1,hp=100,enemies=[],running=false,lastAttack=0,invuln=0;
const persist=()=>{try{localStorage.setItem('shadow-save',JSON.stringify(data))}catch{}};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141020);scene.fog=new THREE.Fog(0x141020,18,43);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8a8ff,0x30202b,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,12,7);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(36,36),new THREE.MeshStandardMaterial({color:0x342b42,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(36,18,0x5b4b78,0x433851);scene.add(grid);
function mesh(geo,color){return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:.7}))}
const hero=new THREE.Group(),body=mesh(new THREE.CapsuleGeometry(.48,1.15,5,10),0x8b5cf6);body.position.y=1.15;hero.add(body);const head=mesh(new THREE.SphereGeometry(.36,12,10),0xeac9a4);head.position.y=2.12;hero.add(head);const sword=mesh(new THREE.BoxGeometry(.12,1.15,.14),0xcbd5e1);sword.position.set(.75,1.2,.1);hero.add(sword);scene.add(hero);
const aura=mesh(new THREE.TorusGeometry(.8,.045,6,32),0xb78aff);aura.rotation.x=Math.PI/2;aura.position.y=.15;hero.add(aura);
const wallMat=new THREE.MeshStandardMaterial({color:0x514366});for(let i=-18;i<=18;i+=3){for(const [x,z] of [[i,-18],[i,18],[-18,i],[18,i]]){const w=new THREE.Mesh(new THREE.BoxGeometry(3,3,1),wallMat);w.position.set(x,1.5,z);if(Math.abs(x)===18)w.rotation.y=Math.PI/2;scene.add(w)}}
const keys=new Set();addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space')attack()});addEventListener('keyup',e=>keys.delete(e.code));
const joystick=$('joystick'),stick=$('stick'),joy={x:0,z:0};const maxStick=40;
function moveStick(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>maxStick){dx=dx/d*maxStick;dy=dy/d*maxStick}joy.x=dx/maxStick;joy.z=dy/maxStick;stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'}
function resetStick(){joy.x=joy.z=0;stick.style.transform='translate(-50%,-50%)'}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);moveStick(e)});
joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))moveStick(e)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(type,resetStick);
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
const colorMap={purple:0x8b5cf6,green:0x34d399,blue:0x38bdf8};
function refresh(){body.material.color.setHex(colorMap[$('heroColor').value]);aura.visible=data.aura;$('wallet').textContent='Gold: '+data.gold;$('shop').innerHTML=data.aura?'✨ Violet Aura owned':'<button id="buy">Buy Violet Aura — 30 gold</button>';if(!data.aura)$('buy').onclick=()=>{if(data.gold<30){$('message').textContent='Earn 30 gold by defeating monsters!';return}data.gold-=30;data.aura=true;persist();refresh()};$('stats').textContent='❤️ '+Math.max(0,Math.ceil(hp))+'  🪙 '+data.gold;$('stage').textContent='Floor '+level+(level%3===0?' · BOSS':' · Monsters '+enemies.length)}
function monster(kind){
 const g=new THREE.Group();const add=(geo,color,x,y,z,sx=1,sy=1,sz=1)=>{const m=mesh(geo,color);m.position.set(x,y,z);m.scale.set(sx,sy,sz);g.add(m);return m};
 const ball=(r,c,x,y,z)=>add(new THREE.SphereGeometry(r,12,9),c,x,y,z);
 if(kind==='slime'){
  ball(.76,0x54db78,0,.65,0).scale.set(1.15,.7,1);
  ball(.13,0x10191b,-.27,.8,.55);ball(.13,0x10191b,.27,.8,.55);
  ball(.055,0xffffff,-.23,.85,.66);ball(.055,0xffffff,.31,.85,.66);
 }else if(kind==='skeleton'){
  ball(.48,0xe9e3cc,0,1.72,0);add(new THREE.BoxGeometry(.7,.65,.3),0xd3cbb5,0,1.02,0);
  for(const x of [-.2,.2]){add(new THREE.BoxGeometry(.16,.62,.18),0xc9c3b5,x,.37,0);ball(.16,0x12101b,x,1.78,.39)}
  add(new THREE.BoxGeometry(.22,.15,.13),0x17131f,0,1.49,.42);
  for(const x of [-.47,.47])add(new THREE.BoxGeometry(.15,.72,.16),0xd7d0bd,x,1.03,0);
 }else if(kind==='bat'){
  ball(.46,0x58316f,0,1.3,0);for(const side of [-1,1]){
   const wing=add(new THREE.ConeGeometry(.72,1.35,3),0x8a4a9d,side*.9,1.45,0);
   wing.rotation.z=side*Math.PI/2;
   add(new THREE.ConeGeometry(.17,.42,4),0x59316c,side*.23,1.83,0);
  }
  for(const x of [-.18,.18])ball(.1,0xff456f,x,1.38,.4);
 }else{
  ball(.9,0x71392c,0,1.25,0).scale.set(1,.95,.75);
  ball(.68,0xa45c38,0,2.25,.08);
  for(const x of [-.44,.44]){
   const horn=add(new THREE.ConeGeometry(.24,.85,7),0xe9c992,x,2.93,0);horn.rotation.z=x>0?-.3:.3;
   ball(.16,0xff512a,x,2.32,.58);
   add(new THREE.BoxGeometry(.36,1.05,.38),0x6c3229,x*1.9,1.25,0);
  }
  add(new THREE.BoxGeometry(.7,.18,.22),0x21141a,0,1.96,.65);
 }
 return g;
}
function spawn(){
 for(const e of enemies)scene.remove(e.obj);enemies=[];
 const bossFloor=level%3===0,count=bossFloor?1:Math.min(3+level,10);
 for(let i=0;i<count;i++){
  const kind=bossFloor?'boss':['slime','skeleton','bat'][(level+i-1)%3],obj=monster(kind);
  const a=i*Math.PI*2/count,r=7+(i%3)*1.5;
  obj.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  scene.add(obj);
  enemies.push({obj,kind,hp:kind==='boss'?10+level*2:kind==='skeleton'?3:2,speed:kind==='boss'?.75:kind==='bat'?1.7:1+level*.07,phase:i*1.8});
 }
 refresh();
}
function show(message){resetStick();running=false;$('panel').style.display='grid';$('controls').style.display='none';$('message').textContent=message;refresh()}
function attack(){if(!running||performance.now()-lastAttack<430)return;lastAttack=performance.now();sword.rotation.z=-.8;setTimeout(()=>sword.rotation.z=0,150);for(let i=enemies.length-1;i>=0;i--){const e=enemies[i];if(e.obj.position.distanceTo(hero.position)<2.8){e.hp--;e.obj.scale.setScalar(1.13);if(e.hp<=0){scene.remove(e.obj);enemies.splice(i,1);data.gold+=e.kind==='boss'?30:5;persist()}}}if(!enemies.length){level++;hp=Math.min(100,hp+25);spawn();show('Floor cleared! +25 health. Gold is yours to keep. Continue to the next floor!');$('start').textContent='Next Floor'}refresh()}
$('start').onclick=()=>{if(!running){if(hp<=0){hp=100;level=1;spawn()}else if(!enemies.length)spawn();hero.position.set(0,0,0);running=true;$('panel').style.display='none';$('controls').style.display='flex';refresh()}};
$('heroColor').onchange=refresh;refresh();spawn();
const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);if(running){let x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'))+joy.x;let z=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'))+joy.z;const len=Math.max(1,Math.hypot(x,z));x/=len;z/=len;hero.position.x=THREE.MathUtils.clamp(hero.position.x+x*dt*6,-16,16);hero.position.z=THREE.MathUtils.clamp(hero.position.z+z*dt*6,-16,16);if(x||z)hero.rotation.y=Math.atan2(x,z);invuln-=dt;for(const e of enemies){const dx=hero.position.x-e.obj.position.x,dz=hero.position.z-e.obj.position.z,dist=Math.hypot(dx,dz);if(dist>1.1){e.obj.position.x+=dx/dist*e.speed*dt;e.obj.position.z+=dz/dist*e.speed*dt}else if(invuln<=0){hp-=12;invuln=.8;if(hp<=0){hp=0;show('You fell in battle! Your gold and purchased cosmetics are saved. Try again.');$('start').textContent='Retry Dungeon'}}e.phase+=dt;e.obj.scale.lerp(new THREE.Vector3(1,1,1),Math.min(1,dt*9));if(e.kind==='slime')e.obj.scale.y*=1+Math.sin(e.phase*5)*.002;if(e.kind==='bat')e.obj.position.y=.2+Math.sin(e.phase*6)*.3;e.obj.rotation.y=Math.atan2(dx,dz)}refresh()}camera.position.lerp(new THREE.Vector3(hero.position.x,9,hero.position.z+12),.09);camera.lookAt(hero.position.x,1,hero.position.z);renderer.render(scene,camera)}frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
