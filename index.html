<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#161126"><title>Shadow Dungeons</title>
<style>

<div id="hud"><span id="stats"></span><span id="stage"></span></div><div id="panel"><div class="card"><h1>⚔ Shadow Dungeons</h1><p id="message">Enter the dungeon. Defeat enemies, collect gold, and return stronger.</p><p id="wallet"></p><label>Hero color <select id="heroColor"><option value="purple">Violet</option><option value="green">Emerald</option><option value="blue">Azure</option></select></label><div id="shop"></div><h3>Weapons</h3><div id="weapons"></div><button id="start">Enter Dungeon</button><p><small>Move: WASD / arrow keys • Attack: Space or button • Auto aim: nearest enemy in range • Mobile: drag the joystick to move</small></p></div></div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';
const $=id=>document.getElementById(id);
const saved=()=>{try{return JSON.parse(localStorage.getItem('shadow-save')||'{}')}catch{return {}}};
let data={gold:0,aura:false,weapon:'sword',ownedWeapons:['sword'],...saved()},level=1,hp=100,enemies=[],running=false,lastAttack=0,invuln=0;
const persist=()=>{try{localStorage.setItem('shadow-save',JSON.stringify(data))}catch{}};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x141020);scene.fog=new THREE.Fog(0x141020,18,43);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xb8a8ff,0x30202b,2));const light=new THREE.DirectionalLight(0xffffff,2);light.position.set(5,12,7);scene.add(light);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(36,36),new THREE.MeshStandardMaterial({color:0x342b42,roughness:1}));floor.rotation.x=-Math.PI/2;scene.add(floor);
const grid=new THREE.GridHelper(36,18,0x5b4b78,0x433851);scene.add(grid);
function mesh(geo,color){return new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color,roughness:.7}))}
const hero=new THREE.Group(),body=mesh(new THREE.CapsuleGeometry(.48,1.15,5,10),0x8b5cf6);body.position.y=1.15;hero.add(body);const head=mesh(new THREE.SphereGeometry(.36,12,10),0xeac9a4);head.position.y=2.12;hero.add(head);
const weaponGroup=new THREE.Group();weaponGroup.position.set(.75,1.25,.1);hero.add(weaponGroup);scene.add(hero);
const weapons={
 sword:{name:'⚔ Sword',price:0,damage:1,range:2.8,cooldown:430,arc:1.4},
 axe:{name:'🪓 Battle Axe',price:25,damage:2,range:2.45,cooldown:800,arc:1.8},
 bow:{name:'🏹 Hunter Bow',price:35,damage:1,range:11,cooldown:620,arc:6.3},
 staff:{name:'✨ Magic Staff',price:50,damage:1,range:8.5,cooldown:750,arc:6.3}
};
function buildWeapon(){
 weaponGroup.clear();
 const type=weapons[data.weapon]?data.weapon:'sword';
 const part=(geo,color,x,y,z)=>{const m=mesh(geo,color);m.position.set(x,y,z);weaponGroup.add(m);return m};
 if(type==='sword'){
  part(new THREE.BoxGeometry(.13,1.05,.14),0xc9d7e7,0,.4,0);
  part(new THREE.ConeGeometry(.13,.32,4),0xe5f3ff,0,1.08,0).rotation.y=Math.PI/4;
  part(new THREE.BoxGeometry(.54,.12,.18),0xc49a43,0,-.17,0);
  part(new THREE.CylinderGeometry(.065,.07,.42,8),0x553b36,0,-.42,0);
 }else if(type==='axe'){
  part(new THREE.CylinderGeometry(.085,.09,1.7,8),0x6b4930,0,.35,0);
  part(new THREE.BoxGeometry(.76,.57,.17),0xaebcc7,.28,1.04,0);
  part(new THREE.BoxGeometry(.12,.66,.22),0xe0ebf2,.65,1.04,0);
 }else if(type==='bow'){
  const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,-.6,0),new THREE.Vector3(-.28,-.3,0),new THREE.Vector3(-.38,.3,0),new THREE.Vector3(-.28,.9,0),new THREE.Vector3(0,1.2,0)]);
  part(new THREE.TubeGeometry(curve,16,.07,6,false),0x9c643b,0,0,0);
  const string=part(new THREE.CylinderGeometry(.018,.018,1.8,5),0xe9e2cb,0,.3,0);
  string.position.set(0,.3,0);
  part(new THREE.CylinderGeometry(.025,.025,1.1,6),0xc7ad7b,-.12,.35,.13).rotation.x=Math.PI/2;
 }else{
  part(new THREE.CylinderGeometry(.075,.09,1.8,8),0x674377,0,.4,0);
  part(new THREE.TorusGeometry(.22,.06,8,16),0xd4a4ff,0,1.4,0);
  part(new THREE.SphereGeometry(.19,12,10),0x7dffed,0,1.4,0);
 }
}
function drawWeapons(){
 const el=$('weapons');el.innerHTML='';
 if(!Array.isArray(data.ownedWeapons))data.ownedWeapons=['sword'];
 if(data.weapon==='spear')data.weapon='bow';if(!weapons[data.weapon])data.weapon='sword';if(data.ownedWeapons.includes('spear')&&!data.ownedWeapons.includes('bow'))data.ownedWeapons.push('bow');
 for(const [id,w] of Object.entries(weapons)){
  const owned=data.ownedWeapons.includes(id),selected=data.weapon===id;
  const b=document.createElement('button');b.className=selected?'selected':'';
  b.textContent=w.name+' · '+(selected?'Equipped':owned?'Equip':w.price+' gold');
  b.onclick=()=>{
   if(!owned){if(data.gold<w.price){$('message').textContent='Not enough gold for '+w.name;return}data.gold-=w.price;data.ownedWeapons.push(id)}
   data.weapon=id;persist();if(data.weapon==='spear')data.weapon='bow';if(Array.isArray(data.ownedWeapons)&&data.ownedWeapons.includes('spear')&&!data.ownedWeapons.includes('bow'))data.ownedWeapons.push('bow');buildWeapon();drawWeapons();refresh();
  };
  el.appendChild(b);
 }
}
buildWeapon();drawWeapons();
const aura=mesh(new THREE.TorusGeometry(.8,.045,6,32),0xb78aff);aura.rotation.x=Math.PI/2;aura.position.y=.15;hero.add(aura);
const wallMat=new THREE.MeshStandardMaterial({color:0x514366});for(let i=-18;i<=18;i+=3){for(const [x,z] of [[i,-18],[i,18],[-18,i],[18,i]]){const w=new THREE.Mesh(new THREE.BoxGeometry(3,3,1),wallMat);w.position.set(x,1.5,z);if(Math.abs(x)===18)w.rotation.y=Math.PI/2;scene.add(w)}}
const keys=new Set();addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Space')attack()});addEventListener('keyup',e=>keys.delete(e.code));
const joystick=$('joystick'),stick=$('stick'),joy={x:0,z:0};const maxStick=40;
function moveStick(e){const r=joystick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>maxStick){dx=dx/d*maxStick;dy=dy/d*maxStick}joy.x=dx/maxStick;joy.z=dy/maxStick;stick.style.transform='translate(calc(-50% + '+dx+'px),calc(-50% + '+dy+'px))'}
function resetStick(){joy.x=joy.z=0;stick.style.transform='translate(-50%,-50%)'}
joystick.addEventListener('pointerdown',e=>{e.preventDefault();joystick.setPointerCapture(e.pointerId);moveStick(e)});
joystick.addEventListener('pointermove',e=>{if(joystick.hasPointerCapture(e.pointerId))moveStick(e)});
for(const type of ['pointerup','pointercancel','lostpointercapture'])joystick.addEventListener(type,resetStick);
$('attack').addEventListener('pointerdown',e=>{e.preventDefault();attack()});
const colorMap={purple:0x8b5cf6,green:0x34d399,blue:0x38bdf8};
function refresh(){body.material.color.setHex(colorMap[$('heroColor').value]);aura.visible=data.aura;$('wallet').textContent='Gold: '+data.gold;$('shop').innerHTML=data.aura?'✨ Violet Aura owned':'<button id="buy">Buy Violet Aura — 30 gold</button>';if(!data.aura)$('buy').onclick=()=>{if(data.gold<30){$('message').textContent='Earn 30 gold by defeating monsters!';return}data.gold-=30;data.aura=true;persist();drawWeapons();refresh()};$('stats').textContent='❤️ '+Math.max(0,Math.ceil(hp))+'  🪙 '+data.gold;$('stage').textContent='Floor '+level+(level%3===0?' · BOSS':' · Monsters '+enemies.length)}
function monster(kind){
 const g=new THREE.Group();
 const add=(geo,color,x,y,z,sx=1,sy=1,sz=1)=>{const m=mesh(geo,color);m.position.set(x,y,z);m.scale.set(sx,sy,sz);g.add(m);return m};
 const ball=(r,c,x,y,z,sx=1,sy=1,sz=1)=>add(new THREE.SphereGeometry(r,16,12),c,x,y,z,sx,sy,sz);
 const box=(w,h,d,c,x,y,z)=>add(new THREE.BoxGeometry(w,h,d),c,x,y,z);
 const cone=(r,h,c,x,y,z,tilt=0)=>{const m=add(new THREE.ConeGeometry(r,h,9),c,x,y,z);m.rotation.z=tilt;return m};
 const tube=(r1,r2,h,c,x,y,z,tilt=0)=>{const m=add(new THREE.CylinderGeometry(r1,r2,h,9),c,x,y,z);m.rotation.z=tilt;return m};
 const eye=(x,y,z,color=0xff4d5b,r=.12)=>{ball(r,0x160e21,x,y,z);ball(r*.68,color,x,y,z+.065);ball(r*.22,0xffffff,x-.025,y+.03,z+.12)};
 if(kind==='slime'){
  ball(.78,0x2da866,0,.62,0,1.15,.76,1.05);
  ball(.68,0x66e79a,0,.76,.09,1.13,.7,1.03);
  ball(.42,0xa3ffd0,-.21,.96,.38,.7,.38,.35);
  for(const x of [-.29,.29])eye(x,.83,.72,0x101d26,.145);
  add(new THREE.TorusGeometry(.19,.038,6,14,Math.PI),0x145b4b,0,.58,.78).rotation.z=Math.PI;
  for(let i=0;i<5;i++){const x=Math.sin(i*2.4)*.55,z=Math.cos(i*2.4)*.47;ball(.12,0x3fc681,x,.2,z)}
  ball(.17,0x8bffbb,.42,1.17,-.04,.9,.5,.8);
 }else if(kind==='skeleton'){
  const bone=0xe9dfc7,shade=0xb8a78d;
  ball(.46,bone,0,1.83,0,1,.98,.85);
  box(.72,.26,.38,bone,0,1.51,.02);
  for(const x of [-.19,.19]){eye(x,1.85,.39,0x70f5f0,.15);box(.1,.18,.12,shade,x,1.44,.29)}
  cone(.12,.19,shade,0,1.68,.42,Math.PI);
  tube(.12,.16,.63,shade,0,1.02,0);
  for(let i=0;i<4;i++){const y=1.32-i*.14;box(.76-i*.08,.075,.27,bone,0,y,.09)}
  for(const side of [-1,1]){
   ball(.18,bone,side*.42,1.37,0);
   tube(.095,.075,.68,bone,side*.52,1.02,0,side*.13);
   ball(.12,shade,side*.58,.68,0);
   tube(.12,.1,.68,bone,side*.22,.36,0,side*.08);
   ball(.13,shade,side*.23,.1,.12);
  }
  box(.58,.19,.28,shade,0,.72,0);
  box(.17,.86,.16,0x674b45,.69,1.15,.12);
  box(.48,.09,.3,0xaab9c8,.69,1.55,.12);
 }else if(kind==='bat'){
  ball(.5,0x402450,0,1.3,0,1,.88,.75);
  ball(.38,0x75438e,0,1.5,.22);
  for(const side of [-1,1]){
   const wingShape=new THREE.Shape();wingShape.moveTo(0,0);wingShape.lineTo(side*.65,.38);wingShape.lineTo(side*1.58,.52);wingShape.lineTo(side*1.36,-.16);wingShape.lineTo(side*.95,-.02);wingShape.lineTo(side*.56,-.35);wingShape.lineTo(0,-.12);
   const wing=new THREE.Mesh(new THREE.ShapeGeometry(wingShape),new THREE.MeshStandardMaterial({color:0x8b509f,side:THREE.DoubleSide,roughness:.8}));wing.position.set(0,1.43,-.1);g.add(wing);
   cone(.19,.46,0x75438e,side*.31,1.98,.02,side*.23);
   ball(.17,0x30203c,side*.22,1.54,.48);eye(side*.22,1.54,.62,0xff3868,.13);
   cone(.085,.2,0xf4d4cf,side*.13,1.18,.4,Math.PI);
  }
  ball(.16,0xb98bc3,0,1.26,.4);
  for(const x of [-.2,.2])cone(.13,.3,0x37213f,x,.91,.05,Math.PI);
 }else{
  ball(.98,0x67352e,0,1.3,0,1,.98,.78);
  ball(.79,0x9d5541,0,2.3,.12,1,.94,.83);
  ball(.57,0x4b2929,0,1.1,.64,1,.6,.26);
  for(const side of [-1,1]){
   ball(.34,0x4a2a2c,side*.85,1.86,0);
   tube(.26,.32,1.13,0x713a32,side*1.04,1.21,0,side*.15);
   ball(.3,0x3a2228,side*1.12,.65,.14);
   tube(.28,.34,.85,0x59302c,side*.46,.47,0,side*.09);
   cone(.29,1.03,0xd8b78c,side*.54,3.18,.02,-side*.35);
   cone(.15,.44,0xe9d7b4,side*.4,1.94,.79,Math.PI);
   eye(side*.36,2.43,.74,0xff572d,.2);
  }
  box(.83,.24,.24,0x2a151b,0,1.98,.79);
  for(let i=0;i<5;i++)cone(.085,.2,0xf2dcc0,(i-2)*.16,1.89,.96,Math.PI);
  for(const x of [-.6,.6]){cone(.25,.52,0x35252d,x,2.06,-.35,x>0?-.5:.5)}
  add(new THREE.TorusGeometry(.85,.065,6,24),0xb77a42,0,1.24,.01,1,.95,.82);
 }
 g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});
 return g;
}
function spawn(){
 for(const e of enemies)scene.remove(e.obj);enemies=[];
 const bossFloor=level%3===0,count=bossFloor?1:Math.min(3+level,10);
 for(let i=0;i<count;i++){
  const kind=bossFloor?'boss':['slime','skeleton','bat'][(level+i-1)%3],obj=monster(kind);
  const a=i*Math.PI*2/count,r=7+(i%3)*1.5;
  obj.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  scene.add(obj);
  enemies.push({obj,kind,hp:kind==='boss'?10+level*2:kind==='skeleton'?3:2,speed:kind==='boss'?.75:kind==='bat'?1.7:1+level*.07,phase:i*1.8,cooldown:1+i*.35,windup:0,attackTime:0,baseY:0});
 }
 refresh();
}
function show(message){resetStick();running=false;$('panel').style.display='grid';$('controls').style.display='none';$('message').textContent=message;refresh()}
const projectiles=[];
function damageEnemy(e,amount){
 if(!enemies.includes(e))return;
 e.hp-=amount;e.obj.scale.setScalar(1.13);
 if(e.hp<=0){
  scene.remove(e.obj);enemies.splice(enemies.indexOf(e),1);
  data.gold+=e.kind==='boss'?30:5;persist();drawWeapons();
  if(!enemies.length){
   level++;hp=Math.min(100,hp+25);spawn();
   show('Floor cleared! +25 health. Gold is yours to keep. Continue to the next floor!');
   $('start').textContent='Next Floor';
  }
 }
 refresh();
}
function attack(){
 const w=weapons[data.weapon]||weapons.sword;
 if(!running||performance.now()-lastAttack<w.cooldown)return;
 const forward=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
 const candidates=enemies.map(e=>{
  const delta=new THREE.Vector3().subVectors(e.obj.position,hero.position);delta.y=0;
  return {e,delta,dist:delta.length()};
 }).filter(t=>t.dist<=w.range&&t.dist>.01).sort((a,b)=>a.dist-b.dist);
 if(!candidates.length)return;
 lastAttack=performance.now();
 const chosen=candidates[0];
 // Auto aim rotates the hero toward the closest monster in weapon range.
 hero.rotation.y=Math.atan2(chosen.delta.x,chosen.delta.z);
 weaponGroup.rotation.z=-.8;
 setTimeout(()=>weaponGroup.rotation.z=0,160);
 if(data.weapon==='bow'||data.weapon==='staff'){
  const isBow=data.weapon==='bow';
  const obj=isBow?new THREE.Group():mesh(new THREE.SphereGeometry(.19,10,8),0x8dfff4);
  if(isBow){
   const shaft=mesh(new THREE.CylinderGeometry(.035,.035,.78,6),0xd6b481);shaft.rotation.x=Math.PI/2;obj.add(shaft);
   const tip=mesh(new THREE.ConeGeometry(.11,.25,6),0xdce9f2);tip.rotation.x=Math.PI/2;tip.position.z=.48;obj.add(tip);
   const fletch=mesh(new THREE.BoxGeometry(.22,.12,.15),0x8a55d2);fletch.position.z=-.32;obj.add(fletch);
  }
  obj.position.copy(hero.position);obj.position.y=1.45;
  scene.add(obj);
  projectiles.push({obj,target:chosen.e,damage:w.damage,speed:isBow?17:12,life:1.5});
 }else{
  const aim=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));
  for(const t of candidates){
   const angle=Math.acos(THREE.MathUtils.clamp(aim.dot(t.delta.clone().normalize()),-1,1));
   if(angle<=w.arc/2)damageEnemy(t.e,w.damage);
  }
 }
}
function updateProjectiles(dt){
 for(let i=projectiles.length-1;i>=0;i--){
  const p=projectiles[i];p.life-=dt;
  if(!running||!enemies.includes(p.target)||p.life<=0){
   scene.remove(p.obj);projectiles.splice(i,1);continue;
  }
  const destination=p.target.obj.position.clone().add(new THREE.Vector3(0,1.2,0));
  const delta=destination.sub(p.obj.position),distance=delta.length();
  if(distance<Math.max(.45,p.speed*dt)){
   scene.remove(p.obj);projectiles.splice(i,1);damageEnemy(p.target,p.damage);
  }else{
   p.obj.position.addScaledVector(delta.normalize(),p.speed*dt);
   p.obj.rotation.y=Math.atan2(delta.x,delta.z);
  }
 }
}
$('start').onclick=()=>{if(!running){for(const p of projectiles)scene.remove(p.obj);projectiles.length=0;if(hp<=0){hp=100;level=1;spawn()}else if(!enemies.length)spawn();hero.position.set(0,0,0);running=true;$('panel').style.display='none';$('controls').style.display='flex';refresh()}};
$('heroColor').onchange=refresh;refresh();spawn();
const clock=new THREE.Clock();
function hurtHero(amount){if(!running||invuln>0)return;hp=Math.max(0,hp-amount);invuln=.85;if(hp<=0){show('You fell in battle! Your gold and purchased cosmetics are saved. Try again.');$('start').textContent='Retry Dungeon'}}
function frame(){
 requestAnimationFrame(frame);
 const dt=Math.min(clock.getDelta(),.05);
 if(running){
  let x=Number(keys.has('KeyD')||keys.has('ArrowRight'))-Number(keys.has('KeyA')||keys.has('ArrowLeft'))+joy.x;
  let z=Number(keys.has('KeyS')||keys.has('ArrowDown'))-Number(keys.has('KeyW')||keys.has('ArrowUp'))+joy.z;
  const len=Math.max(1,Math.hypot(x,z));x/=len;z/=len;
  hero.position.x=THREE.MathUtils.clamp(hero.position.x+x*dt*6,-16,16);
  hero.position.z=THREE.MathUtils.clamp(hero.position.z+z*dt*6,-16,16);
  if(x||z)hero.rotation.y=Math.atan2(x,z);
  invuln=Math.max(0,invuln-dt);
  for(const e of enemies){
   e.phase+=dt;e.cooldown-=dt;
   const dx=hero.position.x-e.obj.position.x,dz=hero.position.z-e.obj.position.z,dist=Math.hypot(dx,dz);
   const range=e.kind==='boss'?3.6:e.kind==='bat'?2.5:e.kind==='skeleton'?1.9:1.5;
   if(e.windup>0){
    e.windup-=dt;
    e.obj.scale.set(1+Math.sin(e.phase*22)*.06,1+Math.sin(e.phase*22)*.06,1+Math.sin(e.phase*22)*.06);
    if(e.windup<=0){
     e.attackTime=.35;
     if(e.kind==='slime'){if(dist<2)hurtHero(9)}
     else if(e.kind==='skeleton'){if(dist<2.35)hurtHero(13)}
     else if(e.kind==='bat'){if(dist<2.9)hurtHero(10)}
     else if(dist<4.1)hurtHero(22);
    }
   }else{
    if(e.attackTime>0)e.attackTime=Math.max(0,e.attackTime-dt);
    if(dist>range*.78 && e.attackTime<=0 && dist>.001){
     const speed=e.speed*(e.kind==='bat'&&e.attackTime>0?2:1);
     e.obj.position.x+=dx/dist*speed*dt;
     e.obj.position.z+=dz/dist*speed*dt;
    }
    if(e.cooldown<=0&&dist<range){
     e.windup=e.kind==='boss'?1.05:e.kind==='skeleton'?.48:e.kind==='bat'?.36:.55;
     e.cooldown=e.kind==='boss'?3.8:e.kind==='skeleton'?2.1:e.kind==='bat'?1.65:2.35;
    }
    e.obj.scale.lerp(new THREE.Vector3(1,1,1),Math.min(1,dt*9));
   }
   if(e.kind==='slime'){
    e.obj.scale.y*=1+Math.sin(e.phase*7)*.008;
    e.obj.position.y=Math.abs(Math.sin(e.phase*4))*(e.windup>0?.32:.12);
   }else if(e.kind==='bat'){
    e.obj.position.y=.35+Math.sin(e.phase*7)*.25+(e.attackTime>0?-.24:0);
    if(e.attackTime>0&&dist>.01){e.obj.position.x+=dx/dist*dt*3;e.obj.position.z+=dz/dist*dt*3}
    e.obj.rotation.z=Math.sin(e.phase*10)*.12;
   }else if(e.kind==='skeleton'){
    e.obj.position.y=Math.abs(Math.sin(e.phase*5))*.06;
    e.obj.rotation.z=e.attackTime>0?-.25:Math.sin(e.phase*3)*.035;
   }else{
    e.obj.position.y=e.attackTime>0?Math.sin(e.attackTime/.35*Math.PI)*.25:0;
    if(e.windup>0)e.obj.scale.setScalar(1.1+Math.sin(e.phase*14)*.03);
   }
   e.obj.rotation.y=Math.atan2(dx,dz);
  }
  updateProjectiles(dt);
  refresh();
 }
 camera.position.lerp(new THREE.Vector3(hero.position.x,9,hero.position.z+12),.09);
 camera.lookAt(hero.position.x,1,hero.position.z);
 renderer.render(scene,camera);
}
frame();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
